ttp_id: T1040
name: Cleartext Credential Exposure
category: credential_access
mitre_tactic: TA0006
mitre_tactic_name: Credential Access
confidence_ceiling: CONFIRMED
required_protocols: [http]

minimum_presence:
  http_packet_count: 1

signals:
  - id: cleartext_creds_any_protocol
    description: Credentials transmitted in cleartext over any protocol
    source: cleartext_creds_detected
    threshold: "== True"
    weight: 0.70
    attack_category: D

  - id: http_basic_auth
    description: HTTP Basic Auth header observed (base64 username:password)
    source: http_cleartext_creds_detected
    threshold: "== True"
    weight: 0.60
    attack_category: D

combination_bonuses:
  - signals: [cleartext_creds_any_protocol, http_basic_auth]
    bonus: 0.10
    reason: Confirmed via two independent signal sources

score_thresholds:
  deep_dive: 0.50
  report: 0.35

false_positive_notes: >
  Legacy internal applications often use HTTP Basic Auth legitimately.
  Check: is this external-facing traffic or internal only?
  Internal-to-internal Basic Auth is lower severity than internal-to-external.
  Extract the actual credential string for analyst review.

references:
  - "MITRE ATT&CK T1040"
  - "CWE-319: Cleartext Transmission of Sensitive Information"
  - "OWASP: Transport Layer Protection"
