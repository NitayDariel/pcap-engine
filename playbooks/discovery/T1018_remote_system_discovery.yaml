ttp_id: T1018
name: Remote System Discovery
category: reconnaissance
mitre_tactic: TA0007
mitre_tactic_name: Discovery
confidence_ceiling: HIGH
required_protocols: [arp]

minimum_presence:
  arp_packet_count: 1

signals:
  - id: arp_sweep
    description: >
      >= 200 ARP packets — an ARP sweep (who-has broadcast to each IP in the subnet)
      is the fastest way to enumerate live hosts on a LAN segment. Attackers run this
      before port scanning to identify targets. Volume > 200 indicates systematic sweeping
      rather than normal traffic.
    source: arp_packet_count
    threshold: ">= 200"
    weight: 0.55
    threshold_low: ">= 80"
    weight_low: 0.25
    attack_category: A

  - id: broad_host_contact
    description: >
      >= 30 unique destination hosts from one source — systematic host enumeration.
      Combined with ARP sweeps, this completes the reconnaissance pattern.
    source: scan_max_unique_dst_hosts
    threshold: ">= 30"
    weight: 0.40
    threshold_low: ">= 15"
    weight_low: 0.18
    attack_category: B

  - id: gratuitous_arp_probes
    description: >
      >= 3 gratuitous ARPs during a discovery phase can indicate an attacker probing
      which IPs respond — probing with sender=target to see who responds.
    source: arp_gratuitous_count
    threshold: ">= 3"
    weight: 0.20
    attack_category: A

combination_bonuses:
  - signals: [arp_sweep, broad_host_contact]
    bonus: 0.15
    reason: ARP sweep + multi-host TCP contact together confirms active host enumeration

score_thresholds:
  deep_dive: 0.50
  report: 0.30

false_positive_notes: >
  Network discovery tools (Nessus, NMAP host-discovery mode, SCCM inventory) produce
  identical patterns. ARP sweeps are also generated by normal Windows network discovery
  (Network Neighborhood). Check: is the source a known scanner? Is the sweep systematic
  (every .1 through .254) or random?

references:
  - "MITRE ATT&CK T1018"
  - "https://attack.mitre.org/techniques/T1018/"
